services:
  server-rest:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
    networks:
      - benchmark

  server-graphql:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
    networks:
      - benchmark

  server-jsonrpc:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
    networks:
      - benchmark

  server-grpc:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
    networks:
      - benchmark

  cadvisor:
    image: google/cadvisor@sha256:815386ebbe9a3490f38785ab11bda34ec8dacf4634af77b8912832d4f85dca04
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=5s"
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - benchmark

  docker-metrics:
    build:
      context: ./observability
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - benchmark

  prometheus:
    image: prom/prometheus@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - cadvisor
      - docker-metrics
    networks:
      - benchmark

  grafana:
    image: grafana/grafana@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - benchmark

  k6-single:
    image: grafana/k6@sha256:3d8e5c7f1d53ec59408c2ffbd9943602a0985ffcbd4a2430ec00f3ffca89796e
    profiles:
      - loadtest
    working_dir: /results
    command:
      - run
      - -o
      - experimental-prometheus-rw
      - /scripts/load_test.js
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "false"
      K6_PROMETHEUS_RW_TREND_STATS: "p(50),p(95),p(99)"
      K6_PROMETHEUS_RW_PUSH_INTERVAL: "5s"
      K6_PROMETHEUS_RW_STALE_MARKERS: "true"
      REST_URL: http://server-rest:8080/api/ticks
      GRAPHQL_URL: http://server-graphql:8080/graphql
      JSONRPC_URL: http://server-jsonrpc:8080/jsonrpc
      BATCH_REST_URL: http://server-rest:8080/api/ticks/batch
      BATCH_GRAPHQL_URL: http://server-graphql:8080/graphql
      BATCH_JSONRPC_URL: http://server-jsonrpc:8080/jsonrpc
      GRPC_ADDRESS: server-grpc:50051
      GRPC_PROTO_DIR: /proto
    volumes:
      - ./tests:/scripts:ro
      - ./proto:/proto:ro
      - ./results:/results
    depends_on:
      - server-rest
      - server-graphql
      - server-jsonrpc
      - server-grpc
      - prometheus
    networks:
      - benchmark

  k6-batch:
    image: grafana/k6@sha256:3d8e5c7f1d53ec59408c2ffbd9943602a0985ffcbd4a2430ec00f3ffca89796e
    profiles:
      - loadtest
    working_dir: /results
    command:
      - run
      - -o
      - experimental-prometheus-rw
      - /scripts/load_test_batch.js
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "false"
      K6_PROMETHEUS_RW_TREND_STATS: "p(50),p(95),p(99)"
      K6_PROMETHEUS_RW_PUSH_INTERVAL: "5s"
      K6_PROMETHEUS_RW_STALE_MARKERS: "true"
      BATCH_REST_URL: http://server-rest:8080/api/ticks/batch
      BATCH_GRAPHQL_URL: http://server-graphql:8080/graphql
      BATCH_JSONRPC_URL: http://server-jsonrpc:8080/jsonrpc
      GRPC_ADDRESS: server-grpc:50051
      GRPC_PROTO_DIR: /proto
    volumes:
      - ./tests:/scripts:ro
      - ./proto:/proto:ro
      - ./results:/results
    depends_on:
      - server-rest
      - server-graphql
      - server-jsonrpc
      - server-grpc
      - prometheus
    networks:
      - benchmark

networks:
  benchmark:
    name: mgl870-benchmark

volumes:
  grafana-data:
  prometheus-data:
