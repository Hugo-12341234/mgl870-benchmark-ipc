services:
  server-rest:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - benchmark

  server-graphql:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - benchmark

  server-jsonrpc:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - benchmark

  server-grpc:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - benchmark

  cadvisor:
    image: google/cadvisor:latest
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=5s"
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - benchmark

  docker-metrics:
    build:
      context: ./observability
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - benchmark

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--storage.tsdb.retention.time=24h"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - cadvisor
      - docker-metrics
    networks:
      - benchmark

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - benchmark

  k6:
    image: grafana/k6:latest
    profiles:
      - loadtest
    working_dir: /results
    command:
      - run
      - -o
      - experimental-prometheus-rw
      - /scripts/load_test.js
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "false"
      K6_PROMETHEUS_RW_TREND_STATS: "p(50),p(95),p(99)"
      REST_URL: http://server-rest:8080/api/ticks
      GRAPHQL_URL: http://server-graphql:8080/graphql
      JSONRPC_URL: http://server-jsonrpc:8080/jsonrpc
      GRPC_ADDRESS: server-grpc:50051
      GRPC_PROTO_DIR: /proto
    volumes:
      - ./tests:/scripts:ro
      - ./proto:/proto:ro
      - ./results:/results
    depends_on:
      - server-rest
      - server-graphql
      - server-jsonrpc
      - server-grpc
      - prometheus
    networks:
      - benchmark

networks:
  benchmark:
    name: mgl870-benchmark

volumes:
  grafana-data:
  prometheus-data:
