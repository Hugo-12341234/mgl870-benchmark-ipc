services:
  server-rest:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - benchmark

  server-graphql:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - benchmark

  server-jsonrpc:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - benchmark

  server-grpc:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - benchmark

  cadvisor:
    image: google/cadvisor:latest
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - benchmark

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - cadvisor
    networks:
      - benchmark

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - benchmark

networks:
  benchmark:
    name: mgl870-benchmark

volumes:
  grafana-data:
