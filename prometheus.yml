global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: docker-metrics
    scrape_interval: 15s
    scrape_timeout: 12s
    static_configs:
      - targets:
          - docker-metrics:9100