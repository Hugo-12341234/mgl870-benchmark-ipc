[package]
name = "mgl870-benchmark-ipc"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
async-graphql = "7"
async-graphql-axum = "7"
async-trait = "0.1"
jsonrpsee = { version = "0.24", features = ["macros", "server"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = "0.12"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
