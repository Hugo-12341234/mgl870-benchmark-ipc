syntax = "proto3";

package tick;

message TickMessage {
  string symbol = 1;
  double price = 2;
  uint32 volume = 3;
  uint64 timestamp = 4;
}

message Ack {}

message TickList {
  repeated TickMessage ticks = 1;
}

service TickIngestion {
  rpc IngestTick(TickMessage) returns (Ack);
  rpc IngestTickBatch(TickList) returns (Ack);
}